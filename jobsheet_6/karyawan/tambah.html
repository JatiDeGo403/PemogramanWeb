<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Informasi Penjualan | Tambah Karyawan</title>

    <link rel="stylesheet" href="../asset/css/style.css">
</head>
<body>

    <header class="top-header">
        <h1>Sistem Informasi Penjualan</h1>
        <p>Manajemen Data Karyawan</p>
    </header>


    <nav class="navbar">
        <a href="../index.html">Beranda</a>
        <a href="../Barang/list.html">Data Barang</a>
        <a href="../Barang/tambah.html">Tambah Barang</a>
        <a href="../karyawan/list.html">Data Karyawan</a>
        <a href="../karyawan/tambah.html">Tambah Karyawan</a>
    </nav>

    <main>

        <section class="card">
            <h2 class="card-title">Tambah Data Karyawan Baru</h2>
            
            <form id="form-tambah-karyawan">
                <div class="form-group">
                    <label for="id_karyawan">ID Karyawan / NIK</label>
                    <input type="text" id="id_karyawan" name="id_karyawan" placeholder="Contoh: KRY-001" required>
                </div>
                
                <div class="form-group">
                    <label for="nama_karyawan">Nama Lengkap</label>
                    <input type="text" id="nama_karyawan" name="nama_karyawan" required>
                </div>

                <div class="form-group">
                    <label for="jabatan">Jabatan / Posisi</label>

                    <select id="jabatan" name="jabatan" required>
                        <option value="">-- Pilih Jabatan --</option>
                        <option value="kasir">Kasir</option>
                        <option value="admin">Admin / Back Office</option>
                        <option value="gudang">Staf Gudang</option>
                        <option value="manajer">Manajer</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="no_hp">No. Handphone</label>
                    <input type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 081234567890" required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat Lengkap</label>
                    <!-- Menggunakan tag textarea yang sudah didesain di CSS -->
                    <textarea id="alamat" name="alamat" placeholder="Masukkan alamat lengkap karyawan" required></textarea>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Simpan Karyawan</button>
                    <button type="reset" class="btn btn-secondary">Batal</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistem Informasi Penjualan &mdash; Jobsheet 6</p>
    </footer>
    
    <script src="../asset/css/js/app.js"></script>
    <script src="../asset/css/js/karyawan.js"></script>
</body>
</html>
