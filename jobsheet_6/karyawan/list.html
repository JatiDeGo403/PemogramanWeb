<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Penjualan | Data Karyawan</title>
    <link rel="stylesheet" href="../asset/css/style.css">
</head>
<body>
    <header class="top-header">
        <h1>Sistem Informasi Penjualan</h1>
        <p>Manajemen Data Karyawan</p>
    </header>

    <nav class="navbar">
        <a href="../index.html">Beranda</a>
        <a href="../Barang/list.html">Data Barang</a>
        <a href="../Barang/tambah.html">Tambah Barang</a>
        <a href="list.html">Data Karyawan</a>
        <a href="tambah.html">Tambah Karyawan</a>
    </nav>

    <main>
        <div class="card">
            <div class="card-title">Daftar Karyawan Bertugas</div>
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="search-input">Cari Nama Karyawan</label>
                <input type="text" id="search-input" placeholder="Ketik nama karyawan..." style="max-width: 300px;">
            </div>

            <!-- Loading Indicator[cite: 14] -->
            <p id="loading-indicator" style="display:none; color: #FF8C00; font-weight: bold; margin-bottom: 1rem;">Memuat data karyawan...</p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>NO</th>
                            <th>ID KARYAWAN</th>
                            <th>NAMA LENGKAP</th>
                            <th>POSISI</th>
                            <th>NO WHATSAPP</th>
                            <th>ALAMAT</th>
                            <th>AKSI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dikosongkan, diisi oleh karyawan.js[cite: 14] -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sistem Informasi Penjualan</p>
    </footer>
    
    <script src="../asset/js/app.js"></script>
    <script src="../asset/js/karyawan.js"></script>
</body>
</html>
