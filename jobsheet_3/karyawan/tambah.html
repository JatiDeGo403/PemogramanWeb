<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Penjualan | Tambah Karyawan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Bagian Atas -->
    <header class="top-header">
        <h1>Sistem Informasi Penjualan</h1>
        <p>Manajemen Data Karyawan</p>
    </header>

    <!-- Bagian Tengah -->
    <nav class="navbar">
        <a href="#">Beranda</a>
        <a href="#">Data Barang</a>
        <a href="list_2.html">Data Karyawan</a>
        <a href="tambah_2.html">Tambah Karyawan</a>
    </nav>

    <main>
        <div class="card">
            <div class="card-title">Formulir Tambah Karyawan</div>
            
            <form action="list_2.html">
                <div class="form-group">
                    <label for="id_karyawan">ID Karyawan:</label>
                    <input type="text" id="id_karyawan" name="id_karyawan" placeholder="Contoh: KRY003" required>
                </div>
                
                <div class="form-group">
                    <label for="nama_lengkap">Nama Lengkap:</label>
                    <input type="text" id="nama_lengkap" name="nama_lengkap" placeholder="Contoh: Budi Santoso" required>
                </div>

                <div class="form-group">
                    <label for="posisi">Posisi / Jabatan:</label>
                    <input type="text" id="posisi" name="posisi" placeholder="Contoh: Supervisor">
                </div>
                
                <div class="form-group">
                    <label for="no_wa">No. Telepon / WhatsApp:</label>
                    <input type="text" id="no_wa" name="no_wa" placeholder="Contoh: 08123456789">
                </div>
                
                <div class="form-group">
                    <label for="alamat">Alamat Lengkap:</label>
                    <textarea id="alamat" name="alamat" placeholder="Masukkan alamat karyawan"></textarea>
                </div>
                
                <!-- Grup Tombol Sesuai Gambar -->
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Simpan Data</button>
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='list_2.html'">Batal</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sistem Informasi Penjualan</p>
    </footer>
</body>
</html>
